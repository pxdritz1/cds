name: Native CDS CI

on:
  push:
    branches:
      - feat/native-iced-port
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: native-cds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-check:
    name: Linux / Iced + Wayland
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang \
            libwayland-dev libxkbcommon-dev libfontconfig1-dev \
            libfreetype-dev libexpat1-dev libpulse-dev \
            libpam0g-dev libvulkan-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check native binary
        run: cargo check --all-targets --bin cds

      - name: Run native unit tests
        run: cargo test --all-targets --bin cds
