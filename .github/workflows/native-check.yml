name: native CDS checks

on:
  push:
    branches:
      - feat/native-iced-port
  pull_request:
    branches:
      - feat/native-iced-port

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Wayland and PAM build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libegl1-mesa-dev libvulkan-dev libdbus-1-dev libpam0g-dev
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Check native binary
        run: cargo check --bin cds
